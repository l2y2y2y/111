            <h3>今晚最适合你的 3 个</h3>
            <p class="desc">不是给你看一堆说明，而是帮你在 5 秒内决定：现在就玩哪个、去哪里搜、要不要挂到这场。</p>
            <div class="grid compactGrid">${recommended().map(gameCard).join('')}</div>
          </div>
          <div class="section">
            <h3>全部玩法库</h3>
            <p class="desc">默认先给推荐 3 个，下面再看全部可选项。微信优先在前，H5 内工具放在后面。</p>
            <div class="grid compactGrid">${miniGames.filter(g => g.platform === '微信优先').map(gameCard).join('')}${Object.values(internalGames).map(internalCard).join('')}${miniGames.filter(g => g.platform !== '微信优先').map(gameCard).join('')}</div>
          </div>`;
      };
      const renderTabs = () => tabsWrap.innerHTML = tabs.map(t => `<button type="button" class="tab ${state.view===t.id?'active':''}" data-tab="${t.id}" aria-label="${t.label}"><b>${t.icon}</b><span>${t.label}</span></button>`).join('');
      const render = () => {
        renderTabs();
        document.querySelector('.top').innerHTML = `
          <div>
            <div class="meta">北京 · 周末局 / 微信 H5 落地版</div>
            <div class="topTitle">${viewTitles[state.view] || '今晚推荐'}</div>
          </div>
          <div class="row"><span class="tag">微信优先</span><span class="tag">手机端可用</span></div>
        `;
        if (state.view === 'home') {
          view.innerHTML = renderHome();
        } else if (state.view === 'party') {
          view.innerHTML = renderParty();
        } else if (state.view === 'host') {
          view.innerHTML = renderHost();
        } else {
          view.innerHTML = renderGames();
        }
        history.replaceState(null,'',`?view=${state.view}&party=${state.partyId}&v=4.0`);
      };
      const openGame = id => {
        const g = miniGames.find(i=>i.id===id) || internalGames[id];
        if (!g) return;
        stopChallengeTimer();
        state.activeGame = g;
        $('#sheetTitle').textContent = g.title;
        $('#sheetDesc').textContent = g.search ? `更适合走${g.platform === '抖音补充' ? '抖音' : '微信'}搜索路径，不再走网页外链。` : g.copy;
        $('#sheetBadges').innerHTML = g.search
          ? `<span class="badge">手机可玩</span><span class="badge">${g.platform}</span><span class="badge">${g.people}</span>`
          : `<span class="badge">H5 内直玩</span><span class="badge">${g.people}</span>`;
        $('#sheetAction').textContent = g.search ? (g.platform === '抖音补充' ? '复制抖音搜索词' : '复制微信搜索词') : g.action;
        clearTimeout($('#sheetAction')._flashTimer);
        $('#sheetAction').dataset.originalLabel = $('#sheetAction').textContent;
        if (g.search) {
          sheetGameArea.classList.add('hidden');
          sheetGameArea.innerHTML = '';
        } else {
          renderInternalGameArea(g.id);
        }
        sheet.classList.add('show');
        sheet.focus();
      };
      const closeSheet = () => {
        stopChallengeTimer();
        sheet.classList.remove('show');
        sheetGameArea.classList.add('hidden');
        state.activeGame = null;
      };
      sheetOverlay.addEventListener('click', closeSheet);
      document.querySelector('.sheetCard').addEventListener('click', e => e.stopPropagation());
      document.addEventListener('click', e => {
        if (sheet.classList.contains('show') && !e.target.closest('.sheetCard')) {
          closeSheet();
          return;
        }
        const t = e.target.closest('[data-tab],[data-nav],[data-set],[data-copy-share],[data-signup],[data-copy-game],[data-open],[data-tool],[data-attach],[data-draft],[data-cycle-party],[data-template],[data-copy-template]');
        if (!t) return;
        if (t.dataset.tab) { state.view = t.dataset.tab; render(); return; }
        if (t.dataset.nav) { state.view = t.dataset.nav; render(); return; }
        if (t.dataset.set) { state[t.dataset.set] = t.dataset.val; render(); return; }
        if (t.dataset.cycleParty !== undefined) { state.partyId = nextParty().id; render(); return; }
        if (t.dataset.template) { state.hostTemplate = t.dataset.template; render(); return; }
        if (t.dataset.copyShare !== undefined) {
          copy(shareText(party()), '已复制补位文案');
          flashButton(t, '已复制');
          return;
        }
        if (t.dataset.copyTemplate !== undefined) {
          copy(templateShareText(hostTemplate()), '已复制发群文案');
          flashButton(t, '已复制');
          return;
        }
        if (t.dataset.draft !== undefined) {
          toast('草稿已保存到当前页会话');
          flashButton(t, '已保存');
          return;
        }
        if (t.dataset.signup !== undefined) {
          if (!isSignedUp(state.partyId)) {
            state.signedUp[state.partyId] = true;
            toast('报名成功，已进入待确认状态');
            render();
          } else {
            toast('你已经报过这场局了');
          }
          return;
        }
        if (t.dataset.copyGame) {
          const g = miniGames.find(i => i.id === t.dataset.copyGame);
          if (!g) return;
          copy(`${g.platform === '抖音补充' ? '抖音' : '微信'}搜索：${g.search}`, `已复制${g.platform === '抖音补充' ? '抖音' : '微信'}搜索词，去对应 App 直接搜`);
          flashButton(t, '已复制');
          return;
        }
        if (t.dataset.open) { openGame(t.dataset.open); return; }
        if (t.dataset.tool) { openGame(t.dataset.tool); return; }
        if (t.dataset.attach) {
          const list = state.attached[state.partyId] || (state.attached[state.partyId] = []);
          if (!list.includes(t.dataset.attach)) {
            list.push(t.dataset.attach);
            toast('已加入本局');
          } else {
            toast('这个玩法已经在本局里了');
          }
          render();
          return;
        }
      });
      const onEscapeClose = e => {
        if (e.key === 'Escape' && sheet.classList.contains('show')) closeSheet();
      };
      sheet.addEventListener('keydown', onEscapeClose);
      document.addEventListener('keydown', onEscapeClose);
      window.addEventListener('keydown', onEscapeClose);
      $('#sheetClose').onclick = () => closeSheet();
      $('#sheetAction').onclick = () => {
        const g = state.activeGame;
        if (!g) return;
        if (g.search) {
          copy(`${g.platform === '抖音补充' ? '抖音' : '微信'}搜索：${g.search}`, `已复制${g.platform === '抖音补充' ? '抖音' : '微信'}搜索词，去对应 App 直接搜`);
        } else {
          if (g.id === 'wheel') {
            state.playState.wheel = gamePlayData.wheel[Math.floor(Math.random() * gamePlayData.wheel.length)];
            renderInternalGameArea('wheel');
            flashButton($('#sheetAction'), '再转一次');
            toast('转盘已开启');
            return;
          }
          if (g.id === 'truth') {
            state.playState.truth = gamePlayData.truth[Math.floor(Math.random() * gamePlayData.truth.length)];
            renderInternalGameArea('truth');
            flashButton($('#sheetAction'), '再抽一题');
            toast('已抽出一题');
            return;
          }
          if (g.id === 'challenge') {
            stopChallengeTimer();
            state.playState.challenge = gamePlayData.challenge[Math.floor(Math.random() * gamePlayData.challenge.length)];
            state.challengeCountdown = 10;
            renderInternalGameArea('challenge');
            state.challengeTimer = setInterval(() => {
              state.challengeCountdown -= 1;
              if (state.challengeCountdown <= 0) {
                state.challengeCountdown = 0;
                stopChallengeTimer();
                toast('挑战时间到，输了的人该喝了');
              }
              if (state.activeGame?.id === 'challenge') renderInternalGameArea('challenge');
            }, 1000);
            flashButton($('#sheetAction'), '再来一张');
            toast('挑战已开始');
            return;
          }
        }
      };
      render();
    })();
  </script>
</body>
</html>
