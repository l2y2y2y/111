<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>今晚喝点什么｜周末喝酒拼局</title>
  <meta name="description" content="适合微信分享的周末喝酒拼局 H5，支持发局、报名、补位和微信优先小游戏推荐。">
  <meta name="theme-color" content="#120d19">
  <style>
    :root{--bg:#120d19;--panel:#1d1527;--panel2:#281a35;--line:rgba(255,255,255,.1);--text:#f7f1fb;--muted:#c4b6d6;--sub:#9584aa;--pink:#ff6b8f;--violet:#9f73ff;--gold:#ffbf6d;--green:#64d7a7;--r:22px;--safe:max(16px,env(safe-area-inset-bottom));font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at top,#3a2247 0,#120d19 45%,#0a0710 100%);color:var(--text)}body{overflow:hidden}
    button,input,textarea,select{font:inherit}
    .app{height:100%;display:flex;justify-content:center;padding:18px}
    .phone{width:min(430px,100%);height:min(920px,100vh - 36px);border-radius:36px;padding:10px;background:linear-gradient(180deg,#2e2438,#0c0912);box-shadow:0 30px 90px rgba(0,0,0,.45);position:relative}
    .phone:before{content:"";position:absolute;top:16px;left:50%;transform:translateX(-50%);width:116px;height:24px;background:rgba(0,0,0,.55);border-radius:999px;z-index:4}
    .screen{height:100%;border-radius:28px;overflow:hidden;background:
      radial-gradient(circle at top right,rgba(255,107,143,.18),transparent 28%),
      radial-gradient(circle at top left,rgba(159,115,255,.22),transparent 28%),
      linear-gradient(180deg,#16101f 0,#0f0c15 100%)}
    .top{padding:34px 18px 10px;display:flex;justify-content:space-between;align-items:center}
    .meta{font-size:12px;color:var(--muted)}
    .view{height:calc(100% - 60px);overflow:auto;padding:0 18px calc(90px + var(--safe));-ms-overflow-style:none;scrollbar-width:none}
    .view::-webkit-scrollbar{display:none}
    .hero{padding:10px 0 18px}
    .eyebrow{font-size:12px;letter-spacing:.08em;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:10px}
    h1,h2,h3,h4,p{margin:0}
    h1{font-size:30px;line-height:1.15}
    .sub{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.7}
    .card,.panel,.party,.game,.mini{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:var(--r)}
    .heroCard{padding:18px;background:linear-gradient(145deg,rgba(255,107,143,.2),rgba(159,115,255,.18) 55%,rgba(255,191,109,.12));box-shadow:0 18px 50px rgba(0,0,0,.25)}
    .row{display:flex;gap:8px;flex-wrap:wrap}.pill,.tag,.chip{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;font-size:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--text)}
    .chip{cursor:pointer;color:var(--muted)}.chip.active{background:linear-gradient(135deg,rgba(255,107,143,.28),rgba(159,115,255,.3));color:#fff}
    .section{margin-top:18px}.section h3{font-size:18px;margin-bottom:6px}.section .desc{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:12px}
    .stack{display:grid;gap:12px}
    .party{padding:16px}
    .party .title{font-size:18px;font-weight:800}
    .small{font-size:12px;color:var(--sub)}
    .muted{color:var(--muted);font-size:13px;line-height:1.7}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
    .metric{padding:12px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
    .metric b{display:block;font-size:16px}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .btn,.btn2{border:0;border-radius:16px;padding:12px 14px;font-weight:800;cursor:pointer}
    .btn{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff}
    .btn2{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.12)}
    .grid{display:grid;gap:12px}
    .game{padding:14px}
    .game h4{font-size:17px}
    .game .why{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.7}
    .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .badge{padding:6px 10px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
    .inline{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .tabs{position:absolute;left:18px;right:18px;bottom:calc(10px + var(--safe));display:grid;grid-template-columns:repeat(4,1fr);gap:10px;z-index:5}
    .tab{padding:11px 8px;border-radius:18px;background:rgba(18,12,26,.92);border:1px solid rgba(255,255,255,.08);text-align:center;font-size:12px;color:var(--muted);cursor:pointer}
    .tab.active{color:#fff;background:linear-gradient(135deg,rgba(255,107,143,.28),rgba(159,115,255,.22))}
    .hidden{display:none!important}
    .field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}
    .input,.textarea{width:100%;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);padding:13px 14px;color:#fff;outline:none}
    .textarea{min-height:90px;resize:vertical}
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .toolbar{display:grid;gap:12px}
    .sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;padding:18px}
    .sheet.show{display:flex}.sheetCard{width:min(430px,100%);background:#130f1b;border:1px solid rgba(255,255,255,.1);border-radius:26px;padding:18px}
    .sheetTitle{font-size:20px;font-weight:800}
    .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(9,8,14,.92);border:1px solid rgba(255,255,255,.12);padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}
    .toast.show{opacity:1}
  </style>
</head>
<body>
  <div class="app">
    <div class="phone">
      <div class="screen">
        <div class="top">
          <div class="meta">北京 · 周末局 / 微信 H5 落地版</div>
          <div class="row"><span class="tag">微信优先</span><span class="tag">手机端可用</span></div>
        </div>
        <div class="view" id="view"></div>
        <div class="tabs" id="tabs"></div>
      </div>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheetCard">
      <div class="sheetTitle" id="sheetTitle">玩法详情</div>
      <p class="sub" id="sheetDesc"></p>
      <div class="badges" id="sheetBadges"></div>
      <div class="btns">
        <button class="btn" id="sheetAction">复制微信搜索词</button>
        <button class="btn2" id="sheetClose">关闭</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    (() => {
      const qs = new URLSearchParams(location.search);
      const tabs = [
        {id:'home',label:'首页'},
        {id:'party',label:'局详情'},
        {id:'host',label:'主理台'},
        {id:'games',label:'游戏'}
      ];
      const parties = [
        {id:'p1',name:'周五精酿轻松局',time:'今晚 20:30',venue:'三里屯某精酿吧',quota:'还差 1 人',size:6,cap:8,vibe:'微醺轻社交',pitch:'新手友好、不会太社恐，适合下班后喝一杯。',host:'Mika',games:['draw','undercover','truth']},
        {id:'p2',name:'威士忌入门慢喝局',time:'今晚 21:00',venue:'国贸附近酒馆',quota:'还差 3 人',size:3,cap:6,vibe:'认真喝威士忌',pitch:'灯光偏暗，适合想认真喝和认真聊的人。',host:'Allen',games:['gomoku','soup','doudizhu']}
      ];
      const internalGames = {
        wheel:{id:'wheel',title:'喝酒轮盘',type:'内置玩法',people:'3-5+',desc:'适合第一轮喝完后快速把气氛带起来。',action:'立即开转盘',copy:'轮盘类最适合热场，谁中谁喝。'},
        truth:{id:'truth',title:'真心话夜场版',type:'内置玩法',people:'2-5+',desc:'按轻、中、深三档走，不会一上来就尬。',action:'开始抽题',copy:'适合关系已经稍微熟起来后继续往里走。'},
        challenge:{id:'challenge',title:'今晚挑战卡',type:'内置玩法',people:'3-5+',desc:'10 秒内完成一个桌面挑战，适合后半场制造高光。',action:'开始挑战',copy:'适合朋友局后半场搞点笑点。'}
      };
      const miniGames = [
        {id:'gomoku',title:'双人五子棋',platform:'微信优先',search:'双人五子棋 小程序',people:'2 人',moment:'duel',mood:'competitive',why:'两个人想马上分胜负，又不想解释复杂规则时，这个最稳。'},
        {id:'billiards',title:'双人桌球',platform:'微信优先',search:'双人桌球 小游戏',people:'2 人',moment:'duel',mood:'competitive',why:'更轻竞技，适合边喝边玩，不会太烧脑。'},
        {id:'draw',title:'你画我猜',platform:'微信优先',search:'你画我猜 小程序',people:'3-5+',moment:'starter',mood:'funny',why:'社交感最强，破冰、围观、起哄都很自然。'},
        {id:'soup',title:'海龟汤',platform:'微信优先',search:'海龟汤 小程序',people:'2-5+',moment:'warm',mood:'dating',why:'适合已经聊开一点的局，围观和参与感都强。'},
        {id:'undercover',title:'谁是卧底',platform:'微信优先',search:'谁是卧底 小程序',people:'4-8',moment:'party',mood:'funny',why:'朋友局里最稳的互坑玩法，拉人快、规则轻、社交感很强。'},
        {id:'doudizhu',title:'欢乐斗地主',platform:'微信优先',search:'欢乐斗地主 小游戏',people:'3 人',moment:'slow',mood:'competitive',why:'如果这桌更想玩熟悉牌局，这个最省解释成本。'},
        {id:'truthMini',title:'真心话大冒险',platform:'微信优先',search:'真心话大冒险 小程序',people:'2-5+',moment:'warm',mood:'dating',why:'想把聊天往关系层推进时，比纯网页外链更自然。'},
        {id:'douyinFight',title:'抖音小游戏双人对战',platform:'抖音补充',search:'双人对战 小游戏',people:'2-4',moment:'duel',mood:'competitive',why:'有人本来就在抖音里刷视频时，可作为微信方案的补充。'}
      ];
      const state = {
        view: qs.get('view') || 'home',
        partyId: qs.get('party') || 'p1',
        people: '2-5+',
        moment: 'starter',
        mood: 'funny',
        mode: 'wechat',
        attached: {p1:['draw','undercover','truth'],p2:['gomoku','soup','doudizhu']},
        activeGame:null
      };
      const $ = s => document.querySelector(s);
      const view = $('#view'), tabsWrap = $('#tabs'), sheet = $('#sheet');
      const copy = async txt => {
        try { await navigator.clipboard.writeText(txt); toast('已复制'); }
        catch { toast('复制失败，请手动长按'); }
      };
      const toast = txt => {
        const el = $('#toast'); el.textContent = txt; el.classList.add('show');
        clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove('show'),1600);
      };
      const party = () => parties.find(i => i.id === state.partyId) || parties[0];
      const attachedGames = () => (state.attached[state.partyId] || []).map(id => internalGames[id] || miniGames.find(g => g.id === id)).filter(Boolean);
      const score = game => {
        let s = 0;
        if (state.mode === 'wechat' && game.platform === '微信优先') s += 4;
        if (state.mode === 'douyin' && game.platform === '抖音补充') s += 4;
        if (state.people === '2 人' && /2/.test(game.people)) s += 3;
        if (state.people === '3-5+' && /3|4|5/.test(game.people)) s += 3;
        if (state.people === '2-5+' ) s += 2;
        if (game.moment === state.moment) s += 3;
        if (game.mood === state.mood) s += 2;
        if ((state.attached[state.partyId]||[]).includes(game.id)) s += 1;
        return s;
      };
      const recommended = () => [...miniGames].sort((a,b)=>score(b)-score(a)).slice(0,3);
      const gameCard = g => `
        <div class="game">
          <div class="inline"><h4>${g.title}</h4><span class="pill">${g.platform}</span></div>
          <div class="why">${g.why || g.desc}</div>
          <div class="badges">
            <span class="badge">手机可玩</span>
            <span class="badge">${g.platform === '抖音补充' ? '抖音内搜索' : '微信内搜索'}</span>
            <span class="badge">${g.people}</span>
          </div>
          <div class="btns">
            <button class="btn" data-open="${g.id}">${g.platform === '抖音补充' ? '复制抖音搜索词' : '复制微信搜索词'}</button>
            <button class="btn2" data-attach="${g.id}">加入本局</button>
          </div>
        </div>`;
      const internalCard = g => `
        <div class="game">
          <div class="inline"><h4>${g.title}</h4><span class="pill">${g.type}</span></div>
          <div class="why">${g.desc}</div>
          <div class="badges"><span class="badge">H5 内直玩</span><span class="badge">${g.people}</span></div>
          <div class="btns">
            <button class="btn" data-tool="${g.id}">${g.action}</button>
            <button class="btn2" data-attach="${g.id}">加入本局</button>
          </div>
        </div>`;
      const shareText = p => {
        const g = attachedGames().slice(0,2).map(x=>x.title).join(' + ');
        return `${p.name}｜${p.time}，${p.venue}，${p.quota}。今晚玩法：${g || '到场再决定'}。想来直接报名。`;
      };
      const renderHome = () => {
        const p = party();
        return `
          <div class="hero">
            <div class="eyebrow">Tonight's plan</div>
            <h1>三秒挑一场，五分钟把人约起来。</h1>
            <p class="sub">先看今晚最值得发的一场，再决定报名还是自己开局。重点已经从网页小游戏切到微信优先的小程序推荐。</p>
          </div>
          <div class="card heroCard">
            <h3>${p.name}</h3>
            <p class="sub">${p.time} · ${p.venue} · ${p.quota}</p>
            <div class="row" style="margin-top:12px"><span class="pill">${p.vibe}</span><span class="pill">微信优先</span><span class="pill">手机端可用</span></div>
            <div class="btns"><button class="btn" data-nav="party">看详情</button><button class="btn2" data-copy-share>复制补位文案</button></div>
          </div>
          <div class="section">
            <h3>今晚最适合的 3 个</h3>
            <p class="desc">这里不再继续放 4399 外链，只给更适合微信分发的小游戏入口。</p>
            <div class="grid">${recommended().map(gameCard).join('')}</div>
          </div>`;
      };
      const renderParty = () => {
        const p = party();
        return `
          <div class="hero">
            <div class="eyebrow">Tonight's party</div>
            <h1>${p.name}</h1>
            <p class="sub">${p.pitch}</p>
          </div>
          <div class="party">
            <div class="row"><span class="pill">${p.vibe}</span><span class="pill">主理人 ${p.host}</span></div>
            <div class="metrics">
              <div class="metric"><span class="small">时间</span><b>${p.time}</b></div>
              <div class="metric"><span class="small">地点</span><b>${p.venue}</b></div>
              <div class="metric"><span class="small">人数</span><b>${p.size}/${p.cap}</b></div>
            </div>
            <div class="btns"><button class="btn" data-copy-share>复制补位文案</button><button class="btn2" data-nav="games">去配玩法</button></div>
          </div>
          <div class="section">
            <h3>本局已挂玩法</h3>
            <p class="desc">这场局已经配好的默认玩法，打开就能继续推进节奏。</p>
            <div class="grid">${attachedGames().map(g => g.search ? gameCard(g) : internalCard(g)).join('')}</div>
          </div>`;
      };
      const renderHost = () => {
        const p = party();
        return `
          <div class="hero">
            <div class="eyebrow">Host desk</div>
            <h1>主理人工作台</h1>
            <p class="sub">发局后直接生成分享页，再继续看报名、补位和挂玩法。</p>
          </div>
          <div class="panel" style="padding:16px">
            <h3>当前正在管理：${p.name}</h3>
            <p class="sub">${p.time} · ${p.venue}</p>
            <div class="metrics">
              <div class="metric"><span class="small">已占位</span><b>${p.size}</b></div>
              <div class="metric"><span class="small">待补位</span><b>${Math.max(p.cap-p.size,0)}</b></div>
              <div class="metric"><span class="small">已挂玩法</span><b>${attachedGames().length}</b></div>
            </div>
          </div>
          <div class="section">
            <h3>快速发起一局</h3>
            <div class="toolbar">
              <div class="field"><label>局标题</label><input class="input" placeholder="比如：周六 rooftop 鸡尾酒局"></div>
              <div class="cols">
                <div class="field"><label>时间</label><input class="input" placeholder="周六 20:30"></div>
                <div class="field"><label>人数上限</label><input class="input" placeholder="8"></div>
              </div>
              <div class="field"><label>地点</label><input class="input" placeholder="朝阳 / 三里屯"></div>
              <div class="field"><label>局感文案</label><textarea class="textarea" placeholder="一句话说清楚这场局的气氛。"></textarea></div>
              <div class="btns"><button class="btn">保存草稿</button><button class="btn2" data-copy-share>复制补位文案模板</button></div>
            </div>
          </div>`;
      };
      const renderGames = () => {
        return `
          <div class="hero">
            <div class="eyebrow">Party games</div>
            <h1>不知道玩什么，就先让它替你选。</h1>
            <p class="sub">先判断现在是两个人还是一桌人、想对战还是升温，再从内置玩法和微信优先的小程序游戏里直接给你 3 个建议。</p>
          </div>
          <div class="panel" style="padding:16px">
            <div class="field"><label>适合几个人</label><div class="row" data-group="people">
              ${['2 人','3-5+','2-5+'].map(v=>`<button class="chip ${state.people===v?'active':''}" data-set="people" data-val="${v}">${v}</button>`).join('')}
            </div></div>
            <div class="field"><label>现在处在哪个时刻</label><div class="row" data-group="moment">
              ${[{v:'starter',t:'刚坐下'},{v:'warm',t:'聊开了'},{v:'party',t:'热起来了'},{v:'duel',t:'想对战'}].map(i=>`<button class="chip ${state.moment===i.v?'active':''}" data-set="moment" data-val="${i.v}">${i.t}</button>`).join('')}
            </div></div>
            <div class="field"><label>想要什么气氛</label><div class="row" data-group="mood">
              ${[{v:'funny',t:'轻松'},{v:'competitive',t:'对战'},{v:'dating',t:'升温'}].map(i=>`<button class="chip ${state.mood===i.v?'active':''}" data-set="mood" data-val="${i.v}">${i.t}</button>`).join('')}
            </div></div>
            <div class="field"><label>优先哪个入口</label><div class="row" data-group="mode">
              ${[{v:'wechat',t:'微信优先'},{v:'mixed',t:'H5 + 微信都可以'},{v:'douyin',t:'抖音补充'}].map(i=>`<button class="chip ${state.mode===i.v?'active':''}" data-set="mode" data-val="${i.v}">${i.t}</button>`).join('')}
            </div></div>
            <p class="sub" style="margin-top:10px">下面只展示 H5 内玩法和微信优先的小程序推荐。</p>
          </div>
          <div class="section">
            <h3>今晚最适合你的 3 个</h3>
            <p class="desc">重点不是网页直跳，而是帮你快速决定现在玩什么、去哪里搜、怎么拉全桌一起上。</p>
            <div class="grid">${recommended().map(gameCard).join('')}</div>
          </div>
          <div class="section">
            <h3>微信优先推荐</h3>
            <p class="desc">只保留手机端更普适、社交感更强的小游戏入口。</p>
            <div class="grid">${miniGames.map(gameCard).join('')}</div>
          </div>
          <div class="section">
            <h3>H5 内置玩法</h3>
            <p class="desc">不想跳出当前页时，可以先用这些工具热场。</p>
            <div class="grid">${Object.values(internalGames).map(internalCard).join('')}</div>
          </div>`;
      };
      const renderTabs = () => tabsWrap.innerHTML = tabs.map(t => `<div class="tab ${state.view===t.id?'active':''}" data-tab="${t.id}">${t.label}</div>`).join('');
      const render = () => {
        renderTabs();
        view.innerHTML = state.view==='home' ? renderHome() : state.view==='party' ? renderParty() : state.view==='host' ? renderHost() : renderGames();
        history.replaceState(null,'',`?view=${state.view}&party=${state.partyId}&v=2.7`);
      };
      const openGame = id => {
        const g = miniGames.find(i=>i.id===id) || internalGames[id];
        if (!g) return;
        state.activeGame = g;
        $('#sheetTitle').textContent = g.title;
        $('#sheetDesc').textContent = g.search ? `更适合走${g.platform === '抖音补充' ? '抖音' : '微信'}搜索路径，不再走网页外链。` : g.copy;
        $('#sheetBadges').innerHTML = g.search
          ? `<span class="badge">手机可玩</span><span class="badge">${g.platform}</span><span class="badge">${g.people}</span>`
          : `<span class="badge">H5 内直玩</span><span class="badge">${g.people}</span>`;
        $('#sheetAction').textContent = g.search ? (g.platform === '抖音补充' ? '复制抖音搜索词' : '复制微信搜索词') : g.action;
        sheet.classList.add('show');
      };
      document.addEventListener('click', e => {
        const t = e.target;
        if (t.dataset.tab) { state.view = t.dataset.tab; render(); }
        if (t.dataset.nav) { state.view = t.dataset.nav; render(); }
        if (t.dataset.set) { state[t.dataset.set] = t.dataset.val; render(); }
        if (t.dataset.copyShare) copy(shareText(party()));
        if (t.dataset.open) openGame(t.dataset.open);
        if (t.dataset.tool) openGame(t.dataset.tool);
        if (t.dataset.attach) {
          const list = state.attached[state.partyId] || (state.attached[state.partyId] = []);
          if (!list.includes(t.dataset.attach)) list.push(t.dataset.attach);
          toast('已加入本局'); render();
        }
      });
      $('#sheetClose').onclick = () => sheet.classList.remove('show');
      $('#sheetAction').onclick = () => {
        const g = state.activeGame;
        if (!g) return;
        if (g.search) copy(`${g.platform === '抖音补充' ? '抖音' : '微信'}搜索：${g.search}`);
        else toast(g.copy || '开始');
      };
      render();
    })();
  </script>
</body>
</html>
