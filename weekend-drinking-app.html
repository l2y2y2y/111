<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>今晚喝点什么｜周末喝酒拼局</title>
  <meta name="description" content="适合微信分享的周末喝酒拼局 H5，支持发局、报名、补位和微信优先小游戏推荐。">
  <meta name="theme-color" content="#120d19">
  <style>
    :root{--bg:#120d19;--panel:#1d1527;--panel2:#281a35;--line:rgba(255,255,255,.1);--text:#f7f1fb;--muted:#c4b6d6;--sub:#9584aa;--pink:#ff6b8f;--violet:#9f73ff;--gold:#ffbf6d;--green:#64d7a7;--r:22px;--safe:max(16px,env(safe-area-inset-bottom));font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at top,#3a2247 0,#120d19 45%,#0a0710 100%);color:var(--text)}body{overflow:hidden}
    button,input,textarea,select{font:inherit}
    .app{height:100%;display:flex;justify-content:center;padding:18px}
    .phone{width:min(430px,100%);height:min(920px,100vh - 36px);border-radius:36px;padding:10px;background:linear-gradient(180deg,#2e2438,#0c0912);box-shadow:0 30px 90px rgba(0,0,0,.45);position:relative}
    .phone:before{content:"";position:absolute;top:16px;left:50%;transform:translateX(-50%);width:116px;height:24px;background:rgba(0,0,0,.55);border-radius:999px;z-index:4}
    .screen{height:100%;border-radius:28px;overflow:hidden;background:
      radial-gradient(circle at top right,rgba(255,107,143,.18),transparent 28%),
      radial-gradient(circle at top left,rgba(159,115,255,.22),transparent 28%),
      linear-gradient(180deg,#16101f 0,#0f0c15 100%)}
    .top{padding:34px 18px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .meta{font-size:12px;color:var(--muted)}
    .topTitle{margin-top:6px;font-size:20px;font-weight:800}
    .view{height:calc(100% - 72px);overflow:auto;padding:0 18px calc(156px + var(--safe));-ms-overflow-style:none;scrollbar-width:none}
    .view::-webkit-scrollbar{display:none}
    .hero{padding:10px 0 18px}
    .eyebrow{font-size:12px;letter-spacing:.08em;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:10px}
    h1,h2,h3,h4,p{margin:0}
    h1{font-size:30px;line-height:1.15}
    .sub{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.7}
    .card,.panel,.party,.game,.mini{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:var(--r)}
    .heroCard{padding:18px;background:linear-gradient(145deg,rgba(255,107,143,.2),rgba(159,115,255,.18) 55%,rgba(255,191,109,.12));box-shadow:0 18px 50px rgba(0,0,0,.25)}
    .row{display:flex;gap:8px;flex-wrap:wrap}.pill,.tag,.chip{display:inline-flex;align-items:center;justify-content:center;padding:7px 10px;border-radius:999px;font-size:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--text)}
    .chip{cursor:pointer;color:var(--muted);min-height:40px;touch-action:manipulation}
    .chip.active{background:linear-gradient(135deg,rgba(255,107,143,.28),rgba(159,115,255,.3));color:#fff}
    .chipGroup{display:grid;gap:8px}
    .chipGroup.people{grid-template-columns:repeat(3,minmax(0,1fr))}
    .chipGroup.people .chip{width:100%;padding:12px 8px;font-weight:800}
    .chipGroup:not(.people){grid-template-columns:repeat(2,minmax(0,1fr))}
    .chipGroup.mode{grid-template-columns:1fr}
    .section{margin-top:18px}.section h3{font-size:18px;margin-bottom:6px}.section .desc{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:12px}
    .stack{display:grid;gap:12px}
    .party{padding:16px}
    .party .title{font-size:18px;font-weight:800}
    .small{font-size:12px;color:var(--sub)}
    .muted{color:var(--muted);font-size:13px;line-height:1.7}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
    .metric{padding:12px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
    .metric b{display:block;font-size:16px}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .btn,.btn2{border:0;border-radius:16px;padding:12px 14px;font-weight:800;cursor:pointer}
    .btn{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff}
    .btn2{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.12)}
    .btn.full{width:100%;justify-content:center}
    .grid{display:grid;gap:12px}
    .game{padding:14px}
    .game h4{font-size:17px}
    .game .why{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.7}
    .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .badge{padding:6px 10px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
    .inline{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .tabs{position:absolute;left:18px;right:18px;bottom:calc(10px + var(--safe));display:grid;grid-template-columns:repeat(4,1fr);gap:10px;z-index:5}
    .tab{padding:10px 8px 9px;border-radius:18px;background:rgba(18,12,26,.96);border:1px solid rgba(255,255,255,.08);text-align:center;font-size:12px;color:var(--muted);cursor:pointer;display:grid;gap:4px;align-content:center;min-height:56px}
    .tab b{font-size:14px;line-height:1;color:inherit}
    .tab.active{color:#fff;background:linear-gradient(135deg,rgba(255,107,143,.35),rgba(159,115,255,.26));border-color:rgba(255,255,255,.18);box-shadow:0 10px 24px rgba(0,0,0,.24)}
    .hidden{display:none!important}
    .field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}
    .input,.textarea{width:100%;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);padding:13px 14px;color:#fff;outline:none}
    .textarea{min-height:90px;resize:vertical}
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .toolbar{display:grid;gap:12px}
    .sheet{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;padding:18px;z-index:20}
    .sheet.show{display:flex}
    .sheetOverlay{position:absolute;inset:0;background:rgba(0,0,0,.55)}
    .sheetCard{position:relative;z-index:1;width:min(430px,100%);background:#130f1b;border:1px solid rgba(255,255,255,.1);border-radius:26px;padding:18px}
    .sheetTitle{font-size:20px;font-weight:800}
    .sheetGameArea{margin-top:14px;padding:14px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line);display:grid;gap:12px}
    .playCard{padding:16px;border-radius:18px;background:linear-gradient(145deg,rgba(255,107,143,.14),rgba(159,115,255,.12));border:1px solid rgba(255,255,255,.1)}
    .playCard b{display:block;font-size:18px;line-height:1.5}
    .playCard .small{margin-top:6px;display:block}
    .wheelDisc{width:138px;height:138px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:conic-gradient(var(--pink) 0 25%,var(--violet) 25% 50%,#ffbf6d 50% 75%,#64d7a7 75% 100%);box-shadow:inset 0 0 0 8px rgba(0,0,0,.18),0 10px 26px rgba(0,0,0,.25)}
    .wheelDisc span{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:#120d19;color:#fff;font-weight:800;text-align:center;padding:10px;font-size:14px}
    .miniRow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .miniStat{padding:10px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);text-align:center}
    .miniStat b{display:block;font-size:16px}
    .statusNote{margin-top:10px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.7}
    .statusNote.ok{background:rgba(100,215,167,.08);border-color:rgba(100,215,167,.25);color:#d7ffee}
    .stepList{display:grid;gap:10px;margin-top:12px}
    .stepItem{padding:14px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
    .stepItem b{display:block;font-size:15px;margin-bottom:4px}
    .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(9,8,14,.92);border:1px solid rgba(255,255,255,.12);padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}
    .toast.show{opacity:1}
  </style>
</head>
<body>
  <div class="app">
    <div class="phone">
      <div class="screen">
        <div class="top">
          <div class="meta">北京 · 周末局 / 微信 H5 落地版</div>
          <div class="row"><span class="tag">微信优先</span><span class="tag">手机端可用</span></div>
        </div>
        <div class="view" id="view"></div>
        <div class="tabs" id="tabs"></div>
      </div>
    </div>
  </div>

  <div class="sheet" id="sheet" tabindex="-1">
    <div class="sheetOverlay" id="sheetOverlay"></div>
    <div class="sheetCard">
      <div class="sheetTitle" id="sheetTitle">玩法详情</div>
      <p class="sub" id="sheetDesc"></p>
      <div class="badges" id="sheetBadges"></div>
      <div class="sheetGameArea hidden" id="sheetGameArea"></div>
      <div class="btns">
        <button class="btn" id="sheetAction">复制微信搜索词</button>
        <button class="btn2" id="sheetClose">关闭</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    (() => {
      const qs = new URLSearchParams(location.search);
      const tabs = [
        {id:'home',label:'首页',icon:'首'},
        {id:'party',label:'局详情',icon:'局'},
        {id:'host',label:'发局',icon:'发'},
        {id:'games',label:'游戏',icon:'玩'}
      ];
      const viewTitles = {home:'今晚推荐',party:'局详情',host:'发局',games:'玩法选择'};
      const parties = [
        {id:'p1',name:'周五精酿轻松局',time:'今晚 20:30',venue:'三里屯某精酿吧',quota:'还差 1 人',size:6,cap:8,vibe:'微醺轻社交',pitch:'新手友好、不会太社恐，适合下班后喝一杯。',host:'Mika',games:['draw','undercover','truth']},
        {id:'p2',name:'威士忌入门慢喝局',time:'今晚 21:00',venue:'国贸附近酒馆',quota:'还差 3 人',size:3,cap:6,vibe:'认真喝威士忌',pitch:'灯光偏暗，适合想认真喝和认真聊的人。',host:'Allen',games:['gomoku','soup','doudizhu']}
      ];
      const internalGames = {
        wheel:{id:'wheel',title:'喝酒轮盘',type:'内置玩法',people:'3-5+',desc:'适合第一轮喝完后快速把气氛带起来。',action:'立即开转盘',copy:'轮盘类最适合热场，谁中谁喝。'},
        truth:{id:'truth',title:'真心话夜场版',type:'内置玩法',people:'2-5+',desc:'按轻、中、深三档走，不会一上来就尬。',action:'开始抽题',copy:'适合关系已经稍微熟起来后继续往里走。'},
        challenge:{id:'challenge',title:'今晚挑战卡',type:'内置玩法',people:'3-5+',desc:'10 秒内完成一个桌面挑战，适合后半场制造高光。',action:'开始挑战',copy:'适合朋友局后半场搞点笑点。'}
      };
      const gamePlayData = {
        wheel: [
          {label:'你喝一口',note:'最稳的热场指令，先把第一轮启动。'},
          {label:'左边陪一口',note:'把旁边的人也拉进来，气氛更快热起来。'},
          {label:'讲一个糗事',note:'比纯喝更有内容，容易引出下一轮聊天。'},
          {label:'指定一人喝',note:'适合关系熟一点的时候快速互坑。'},
          {label:'全桌碰杯',note:'适合重新整桌聚焦到同一节奏。'},
          {label:'免喝一次',note:'出一点反差，轮盘才更有戏。'}
        ],
        truth: [
          {tier:'轻',text:'今晚在场的人里，第一眼你最想先跟谁坐近一点？'},
          {tier:'轻',text:'你最近一次喝多后做过最离谱的一件事是什么？'},
          {tier:'中',text:'如果今晚只能和一个人继续转场，你会选谁？'},
          {tier:'中',text:'你最擅长让别人对你产生好感的方式是什么？'},
          {tier:'深',text:'你现在最不想让别人问到的一个感情问题是什么？'},
          {tier:'深',text:'如果今晚有人对你心动，你希望他怎么表达？'}
        ],
        challenge: [
          {title:'闭眼选杯',task:'闭眼 3 秒后随机指一个杯子，猜中自己的那杯就免喝。'},
          {title:'十秒夸人',task:'10 秒内夸现场任意一人 3 句，卡壳就喝。'},
          {title:'桌面传话',task:'用一句最离谱的话把左边的人逗笑，失败就喝。'},
          {title:'反手自拍',task:'10 秒内和同桌完成一张最怪自拍，最慢的人喝。'},
          {title:'数字接龙',task:'从 1 数到 20，逢 3 和 7 相关数字拍桌代替，说错就喝。'}
        ]
      };
      const miniGames = [
        {id:'gomoku',title:'双人五子棋',platform:'微信优先',search:'双人五子棋 小程序',people:'2 人',moment:'duel',mood:'competitive',why:'两个人想马上分胜负，又不想解释复杂规则时，这个最稳。'},
        {id:'billiards',title:'双人桌球',platform:'微信优先',search:'双人桌球 小游戏',people:'2 人',moment:'duel',mood:'competitive',why:'更轻竞技，适合边喝边玩，不会太烧脑。'},
        {id:'draw',title:'你画我猜',platform:'微信优先',search:'你画我猜 小程序',people:'3-5+',moment:'starter',mood:'funny',why:'社交感最强，破冰、围观、起哄都很自然。'},
        {id:'soup',title:'海龟汤',platform:'微信优先',search:'海龟汤 小程序',people:'2-5+',moment:'warm',mood:'dating',why:'适合已经聊开一点的局，围观和参与感都强。'},
        {id:'undercover',title:'谁是卧底',platform:'微信优先',search:'谁是卧底 小程序',people:'4-8',moment:'party',mood:'funny',why:'朋友局里最稳的互坑玩法，拉人快、规则轻、社交感很强。'},
        {id:'doudizhu',title:'欢乐斗地主',platform:'微信优先',search:'欢乐斗地主 小游戏',people:'3 人',moment:'slow',mood:'competitive',why:'如果这桌更想玩熟悉牌局，这个最省解释成本。'},
        {id:'truthMini',title:'真心话大冒险',platform:'微信优先',search:'真心话大冒险 小程序',people:'2-5+',moment:'warm',mood:'dating',why:'想把聊天往关系层推进时，比纯网页外链更自然。'},
        {id:'douyinFight',title:'抖音小游戏双人对战',platform:'抖音补充',search:'双人对战 小游戏',people:'2-4',moment:'duel',mood:'competitive',why:'有人本来就在抖音里刷视频时，可作为微信方案的补充。'}
      ];
      const state = {
        view: qs.get('view') || 'home',
        partyId: qs.get('party') || 'p1',
        people: '2-5+',
        moment: 'starter',
        mood: 'funny',
        mode: 'wechat',
        attached: {p1:['draw','undercover','truth'],p2:['gomoku','soup','doudizhu']},
        signedUp:{},
        playState:{wheel:null,truth:null,challenge:null},
        challengeCountdown:10,
        challengeTimer:null,
        activeGame:null
      };
      const $ = s => document.querySelector(s);
      const view = $('#view'), tabsWrap = $('#tabs'), sheet = $('#sheet'), sheetOverlay = $('#sheetOverlay'), sheetGameArea = $('#sheetGameArea');
      const copy = async (txt, success = '已复制') => {
        try { await navigator.clipboard.writeText(txt); toast(success); }
        catch { toast('复制失败，请手动长按'); }
      };
      const flashButton = (btn, text, duration = 1400) => {
        if (!btn) return;
        const original = btn.dataset.originalLabel || btn.textContent;
        btn.dataset.originalLabel = original;
        btn.textContent = text;
        clearTimeout(btn._flashTimer);
        btn._flashTimer = setTimeout(() => {
          btn.textContent = btn.dataset.originalLabel || original;
        }, duration);
      };
      const toast = txt => {
        const el = $('#toast'); el.textContent = txt; el.classList.add('show');
        clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove('show'),1600);
      };
      const stopChallengeTimer = () => {
        clearInterval(state.challengeTimer);
        state.challengeTimer = null;
      };
      const renderInternalGameArea = id => {
        sheetGameArea.classList.remove('hidden');
        if (id === 'wheel') {
          const result = state.playState.wheel;
          sheetGameArea.innerHTML = `
            <div class="wheelDisc"><span>${result ? result.label : '点击开始'}</span></div>
            <div class="playCard">
              <b>${result ? result.label : '先转一轮，随机决定谁喝或谁发言'}</b>
              <span class="small">${result ? result.note : '这一轮适合热场，第一次开局最适合用它把全桌都拉进来。'}</span>
            </div>
            <div class="miniRow">
              <div class="miniStat"><span class="small">玩法</span><b>轮盘</b></div>
              <div class="miniStat"><span class="small">节奏</span><b>快</b></div>
              <div class="miniStat"><span class="small">适合</span><b>热场</b></div>
            </div>`;
          return;
        }
        if (id === 'truth') {
          const card = state.playState.truth;
          sheetGameArea.innerHTML = `
            <div class="playCard">
              <span class="badge">${card ? `${card.tier}强度` : '未抽题'}</span>
              <b style="margin-top:10px">${card ? card.text : '点“开始抽题”，直接给现场一题能继续聊下去的夜场问题。'}</b>
              <span class="small">${card ? '如果觉得太猛，可以再抽一题换强度。' : '适合关系已经稍微熟起来后继续往里走。'}</span>
            </div>
            <div class="miniRow">
              <div class="miniStat"><span class="small">档位</span><b>${card ? card.tier : '待抽'}</b></div>
              <div class="miniStat"><span class="small">适合</span><b>升温</b></div>
              <div class="miniStat"><span class="small">人数</span><b>2-5+</b></div>
            </div>`;
          return;
        }
        const challenge = state.playState.challenge;
        const left = state.challengeCountdown;
        sheetGameArea.innerHTML = `
          <div class="playCard">
            <span class="badge">${challenge ? '挑战进行中' : '未开始'}</span>
            <b style="margin-top:10px">${challenge ? challenge.title : '点“开始挑战”，系统会给现场一条 10 秒内能做完的桌面任务。'}</b>
            <span class="small">${challenge ? challenge.task : '适合朋友局后半场制造高光。'}</span>
          </div>
          <div class="miniRow">
            <div class="miniStat"><span class="small">倒计时</span><b>${challenge ? left : '-'}</b></div>
            <div class="miniStat"><span class="small">玩法</span><b>挑战卡</b></div>
            <div class="miniStat"><span class="small">适合</span><b>起哄</b></div>
          </div>`;
      };
      const party = () => parties.find(i => i.id === state.partyId) || parties[0];
      const isSignedUp = id => Boolean(state.signedUp[id]);
      const partyStats = p => {
        const signed = isSignedUp(p.id) ? 1 : 0;
        const size = Math.min(p.size + signed, p.cap);
        return {size, cap:p.cap, left:Math.max(p.cap - size, 0)};
      };
      const attachedGames = () => (state.attached[state.partyId] || []).map(id => internalGames[id] || miniGames.find(g => g.id === id)).filter(Boolean);
      const score = game => {
        let s = 0;
        if (state.mode === 'wechat' && game.platform === '微信优先') s += 4;
        if (state.mode === 'douyin' && game.platform === '抖音补充') s += 4;
        if (state.people === '2 人' && /2/.test(game.people)) s += 3;
        if (state.people === '3-5+' && /3|4|5/.test(game.people)) s += 3;
        if (state.people === '2-5+' ) s += 2;
        if (game.moment === state.moment) s += 3;
        if (game.mood === state.mood) s += 2;
        if ((state.attached[state.partyId]||[]).includes(game.id)) s += 1;
        return s;
      };
      const recommended = () => [...miniGames].sort((a,b)=>score(b)-score(a)).slice(0,3);
      const gameCard = g => `
        <div class="game">
          <div class="inline"><h4>${g.title}</h4><span class="pill">${g.platform}</span></div>
          <div class="why">${g.why || g.desc}</div>
          <div class="badges">
            <span class="badge">手机可玩</span>
            <span class="badge">${g.platform === '抖音补充' ? '抖音内搜索' : '微信内搜索'}</span>
            <span class="badge">${g.people}</span>
          </div>
          <div class="btns">
            <button class="btn" data-copy-game="${g.id}">${g.platform === '抖音补充' ? '复制抖音搜索词' : '复制微信搜索词'}</button>
            <button class="btn2" data-attach="${g.id}">${(state.attached[state.partyId]||[]).includes(g.id) ? '已加入本局' : '加入本局'}</button>
          </div>
        </div>`;
      const internalCard = g => `
        <div class="game">
          <div class="inline"><h4>${g.title}</h4><span class="pill">${g.type}</span></div>
          <div class="why">${g.desc}</div>
          <div class="badges"><span class="badge">H5 内直玩</span><span class="badge">${g.people}</span></div>
          <div class="btns">
            <button class="btn" data-tool="${g.id}">${g.action}</button>
            <button class="btn2" data-attach="${g.id}">${(state.attached[state.partyId]||[]).includes(g.id) ? '已加入本局' : '加入本局'}</button>
          </div>
        </div>`;
      const shareText = p => {
        const g = attachedGames().slice(0,2).map(x=>x.title).join(' + ');
        return `${p.name}｜${p.time}，${p.venue}，${p.quota}。今晚玩法：${g || '到场再决定'}。想来直接报名。`;
      };
      const renderHome = () => {
        const p = party();
        const stats = partyStats(p);
        const leadGame = recommended()[0];
        return `
          <div class="hero">
            <div class="eyebrow">Tonight's plan</div>
            <h1>三秒挑一场，五分钟把人约起来。</h1>
            <p class="sub">首页只做一件事：帮你先看懂今晚最值得发的一场，再决定报不报。其他动作放到下一层，不在首屏抢注意力。</p>
          </div>
          <div class="card heroCard">
            <h3>${p.name}</h3>
            <p class="sub">${p.time} · ${p.venue} · ${isSignedUp(p.id) ? '你已报名，待主理人确认' : (stats.left > 0 ? `还差 ${stats.left} 人` : '本局已满') }</p>
            <div class="row" style="margin-top:12px"><span class="pill">${p.vibe}</span><span class="pill">微信优先</span><span class="pill">手机端可用</span></div>
            <div class="btns"><button class="btn full" data-nav="party">查看并报名</button></div>
            <div class="statusNote">先点进详情看时间、地点和今晚玩法，再决定报名或转发，不在首页同时做太多动作。今晚建议先玩：<b>${leadGame.title}</b>，因为${leadGame.why}</div>
          </div>
          <div class="section">
            <h3>今晚最适合的 3 个</h3>
            <p class="desc">这里不再继续放 4399 外链，只给更适合微信分发的小游戏入口。</p>
            <div class="grid">${recommended().map(gameCard).join('')}</div>
          </div>`;
      };
      const renderParty = () => {
        const p = party();
        const stats = partyStats(p);
        return `
          <div class="hero">
            <div class="eyebrow">Tonight's party</div>
            <h1>${p.name}</h1>
            <p class="sub">${p.pitch}</p>
          </div>
          ${isSignedUp(p.id) ? `<div class="statusNote ok">你已报名这场局，当前状态为待主理人确认。现在可以直接复制补位文案，或者去补一个更适合今晚的玩法。</div>` : ''}
          <div class="party">
            <div class="row"><span class="pill">${p.vibe}</span><span class="pill">主理人 ${p.host}</span></div>
            <div class="metrics">
              <div class="metric"><span class="small">时间</span><b>${p.time}</b></div>
              <div class="metric"><span class="small">地点</span><b>${p.venue}</b></div>
              <div class="metric"><span class="small">人数</span><b>${stats.size}/${stats.cap}</b></div>
            </div>
            <div class="btns"><button class="btn" data-signup>${isSignedUp(p.id) ? '已提交报名' : '立即报名'}</button><button class="btn2" data-copy-share>复制补位文案</button><button class="btn2" data-nav="games">去配玩法</button></div>
          </div>
          <div class="section">
            <h3>本局已挂玩法</h3>
            <p class="desc">这场局已经配好的默认玩法，打开就能继续推进节奏。</p>
            <div class="grid">${attachedGames().map(g => g.search ? gameCard(g) : internalCard(g)).join('')}</div>
          </div>`;
      };
      const renderHost = () => {
        const p = party();
        return `
          <div class="hero">
            <div class="eyebrow">Host desk</div>
            <h1>发局与补位</h1>
            <p class="sub">这是主理人操作区，按顺序把一场局发出去，再把人和玩法补齐。</p>
          </div>
          <div class="panel" style="padding:16px">
            <h3>当前正在管理：${p.name}</h3>
            <p class="sub">${p.time} · ${p.venue}</p>
            <div class="metrics">
              <div class="metric"><span class="small">已占位</span><b>${partyStats(p).size}</b></div>
              <div class="metric"><span class="small">待补位</span><b>${partyStats(p).left}</b></div>
              <div class="metric"><span class="small">已挂玩法</span><b>${attachedGames().length}</b></div>
            </div>
            <div class="stepList">
              <div class="stepItem"><b>1. 填局信息</b><span class="small">先把时间、地点、人数说清楚。</span></div>
              <div class="stepItem"><b>2. 选今晚玩法</b><span class="small">给这场局挂 2-3 个最顺手的玩法。</span></div>
              <div class="stepItem"><b>3. 复制补位文案</b><span class="small">把已经带玩法卖点的文案发到群里。</span></div>
            </div>
          </div>
          <div class="section">
            <h3>快速发起一局</h3>
            <div class="toolbar">
              <div class="field"><label>局标题</label><input class="input" placeholder="比如：周六 rooftop 鸡尾酒局"></div>
              <div class="cols">
                <div class="field"><label>时间</label><input class="input" placeholder="周六 20:30"></div>
                <div class="field"><label>人数上限</label><input class="input" placeholder="8"></div>
              </div>
              <div class="field"><label>地点</label><input class="input" placeholder="朝阳 / 三里屯"></div>
              <div class="field"><label>局感文案</label><textarea class="textarea" placeholder="一句话说清楚这场局的气氛。"></textarea></div>
              <div class="btns"><button class="btn" data-draft>保存草稿</button><button class="btn2" data-copy-share>复制补位文案模板</button></div>
            </div>
          </div>`;
      };
      const renderGames = () => {
        return `
          <div class="hero">
            <div class="eyebrow">Party games</div>
            <h1>不知道玩什么，就先让它替你选。</h1>
            <p class="sub">先判断现在是两个人还是一桌人、想对战还是升温，再从内置玩法和微信优先的小程序游戏里直接给你 3 个建议。</p>
          </div>
          <div class="panel" style="padding:16px">
            <div class="field"><label>适合几个人</label><div class="chipGroup people" data-group="people">
              ${['2 人','3-5+','2-5+'].map(v=>`<button type="button" class="chip ${state.people===v?'active':''}" data-set="people" data-val="${v}">${v}</button>`).join('')}
            </div></div>
            <div class="field"><label>现在处在哪个时刻</label><div class="chipGroup" data-group="moment">
              ${[{v:'starter',t:'刚坐下'},{v:'warm',t:'聊开了'},{v:'party',t:'热起来了'},{v:'duel',t:'想对战'}].map(i=>`<button type="button" class="chip ${state.moment===i.v?'active':''}" data-set="moment" data-val="${i.v}">${i.t}</button>`).join('')}
            </div></div>
            <div class="field"><label>想要什么气氛</label><div class="chipGroup" data-group="mood">
              ${[{v:'funny',t:'轻松'},{v:'competitive',t:'对战'},{v:'dating',t:'升温'}].map(i=>`<button type="button" class="chip ${state.mood===i.v?'active':''}" data-set="mood" data-val="${i.v}">${i.t}</button>`).join('')}
            </div></div>
            <div class="field"><label>优先哪个入口</label><div class="chipGroup mode" data-group="mode">
              ${[{v:'wechat',t:'微信优先'},{v:'mixed',t:'H5 + 微信都可以'},{v:'douyin',t:'抖音补充'}].map(i=>`<button type="button" class="chip ${state.mode===i.v?'active':''}" data-set="mode" data-val="${i.v}">${i.t}</button>`).join('')}
</div></div>
            <p class="sub" style="margin-top:10px">下面只展示 H5 内玩法和微信优先的小程序推荐。</p>
          </div>
          <div class="section">
            <h3>今晚最适合你的 3 个</h3>
            <p class="desc">重点不是网页直跳，而是帮你快速决定现在玩什么、去哪里搜、怎么拉全桌一起上。</p>
            <div class="grid">${recommended().map(gameCard).join('')}</div>
          </div>
          <div class="section">
            <h3>全部玩法库</h3>
            <p class="desc">默认先给推荐 3 个，下面再看全部可选项。微信优先在前，H5 内工具放在后面。</p>
            <div class="grid">${miniGames.filter(g => g.platform === '微信优先').map(gameCard).join('')}${Object.values(internalGames).map(internalCard).join('')}${miniGames.filter(g => g.platform !== '微信优先').map(gameCard).join('')}</div>
          </div>`;
      };
      const renderTabs = () => tabsWrap.innerHTML = tabs.map(t => `<button type="button" class="tab ${state.view===t.id?'active':''}" data-tab="${t.id}" aria-label="${t.label}"><b>${t.icon}</b><span>${t.label}</span></button>`).join('');
      const render = () => {
        renderTabs();
        document.querySelector('.top').innerHTML = `
          <div>
            <div class="meta">北京 · 周末局 / 微信 H5 落地版</div>
            <div class="topTitle">${viewTitles[state.view] || '今晚推荐'}</div>
          </div>
          <div class="row"><span class="tag">微信优先</span><span class="tag">手机端可用</span></div>
        `;
        if (state.view === 'home') {
          view.innerHTML = renderHome();
        } else if (state.view === 'party') {
          view.innerHTML = renderParty();
        } else if (state.view === 'host') {
          view.innerHTML = renderHost();
        } else {
          view.innerHTML = renderGames();
        }
        history.replaceState(null,'',`?view=${state.view}&party=${state.partyId}&v=3.8`);
      };
      const openGame = id => {
        const g = miniGames.find(i=>i.id===id) || internalGames[id];
        if (!g) return;
        stopChallengeTimer();
        state.activeGame = g;
        $('#sheetTitle').textContent = g.title;
        $('#sheetDesc').textContent = g.search ? `更适合走${g.platform === '抖音补充' ? '抖音' : '微信'}搜索路径，不再走网页外链。` : g.copy;
        $('#sheetBadges').innerHTML = g.search
          ? `<span class="badge">手机可玩</span><span class="badge">${g.platform}</span><span class="badge">${g.people}</span>`
          : `<span class="badge">H5 内直玩</span><span class="badge">${g.people}</span>`;
        $('#sheetAction').textContent = g.search ? (g.platform === '抖音补充' ? '复制抖音搜索词' : '复制微信搜索词') : g.action;
        clearTimeout($('#sheetAction')._flashTimer);
        $('#sheetAction').dataset.originalLabel = $('#sheetAction').textContent;
        if (g.search) {
          sheetGameArea.classList.add('hidden');
          sheetGameArea.innerHTML = '';
        } else {
          renderInternalGameArea(g.id);
        }
        sheet.classList.add('show');
        sheet.focus();
      };
      const closeSheet = () => {
        stopChallengeTimer();
        sheet.classList.remove('show');
        sheetGameArea.classList.add('hidden');
        state.activeGame = null;
      };
      sheetOverlay.addEventListener('click', closeSheet);
      document.querySelector('.sheetCard').addEventListener('click', e => e.stopPropagation());
      document.addEventListener('click', e => {
        if (sheet.classList.contains('show') && !e.target.closest('.sheetCard')) {
          closeSheet();
          return;
        }
        const t = e.target.closest('[data-tab],[data-nav],[data-set],[data-copy-share],[data-signup],[data-copy-game],[data-open],[data-tool],[data-attach],[data-draft]');
        if (!t) return;
        if (t.dataset.tab) { state.view = t.dataset.tab; render(); return; }
        if (t.dataset.nav) { state.view = t.dataset.nav; render(); return; }
        if (t.dataset.set) { state[t.dataset.set] = t.dataset.val; render(); return; }
        if (t.dataset.copyShare !== undefined) {
          copy(shareText(party()), '已复制补位文案');
          flashButton(t, '已复制');
          return;
        }
        if (t.dataset.draft !== undefined) {
          toast('草稿已保存到当前页会话');
          flashButton(t, '已保存');
          return;
        }
        if (t.dataset.signup !== undefined) {
          if (!isSignedUp(state.partyId)) {
            state.signedUp[state.partyId] = true;
            toast('报名成功，已进入待确认状态');
            render();
          } else {
            toast('你已经报过这场局了');
          }
          return;
        }
        if (t.dataset.copyGame) {
          const g = miniGames.find(i => i.id === t.dataset.copyGame);
          if (!g) return;
          copy(`${g.platform === '抖音补充' ? '抖音' : '微信'}搜索：${g.search}`, `已复制${g.platform === '抖音补充' ? '抖音' : '微信'}搜索词，去对应 App 直接搜`);
          flashButton(t, '已复制');
          return;
        }
        if (t.dataset.open) { openGame(t.dataset.open); return; }
        if (t.dataset.tool) { openGame(t.dataset.tool); return; }
        if (t.dataset.attach) {
          const list = state.attached[state.partyId] || (state.attached[state.partyId] = []);
          if (!list.includes(t.dataset.attach)) {
            list.push(t.dataset.attach);
            toast('已加入本局');
          } else {
            toast('这个玩法已经在本局里了');
          }
          render();
          return;
        }
      });
      const onEscapeClose = e => {
        if (e.key === 'Escape' && sheet.classList.contains('show')) closeSheet();
      };
      sheet.addEventListener('keydown', onEscapeClose);
      document.addEventListener('keydown', onEscapeClose);
      window.addEventListener('keydown', onEscapeClose);
      $('#sheetClose').onclick = () => closeSheet();
      $('#sheetAction').onclick = () => {
        const g = state.activeGame;
        if (!g) return;
        if (g.search) {
          copy(`${g.platform === '抖音补充' ? '抖音' : '微信'}搜索：${g.search}`, `已复制${g.platform === '抖音补充' ? '抖音' : '微信'}搜索词，去对应 App 直接搜`);
        } else {
          if (g.id === 'wheel') {
            state.playState.wheel = gamePlayData.wheel[Math.floor(Math.random() * gamePlayData.wheel.length)];
            renderInternalGameArea('wheel');
            flashButton($('#sheetAction'), '再转一次');
            toast('转盘已开启');
            return;
          }
          if (g.id === 'truth') {
            state.playState.truth = gamePlayData.truth[Math.floor(Math.random() * gamePlayData.truth.length)];
            renderInternalGameArea('truth');
            flashButton($('#sheetAction'), '再抽一题');
            toast('已抽出一题');
            return;
          }
          if (g.id === 'challenge') {
            stopChallengeTimer();
            state.playState.challenge = gamePlayData.challenge[Math.floor(Math.random() * gamePlayData.challenge.length)];
            state.challengeCountdown = 10;
            renderInternalGameArea('challenge');
            state.challengeTimer = setInterval(() => {
              state.challengeCountdown -= 1;
              if (state.challengeCountdown <= 0) {
                state.challengeCountdown = 0;
                stopChallengeTimer();
                toast('挑战时间到，输了的人该喝了');
              }
              if (state.activeGame?.id === 'challenge') renderInternalGameArea('challenge');
            }, 1000);
            flashButton($('#sheetAction'), '再来一张');
            toast('挑战已开始');
            return;
          }
        }
      };
      render();
    })();
  </script>
</body>
</html>
